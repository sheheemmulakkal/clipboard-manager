# Clipboard Manager configuration
# Apply changes with:  clipboard-manager reload
# Every option is optional; the values below are the defaults.

# ── History ──────────────────────────────────────────────────────────────────

# Number of items kept. Pinned items are never evicted.
max_history = 50

# Copying something that is already in the history moves it to the top
# instead of adding a duplicate.
deduplicate = true

# Texts larger than this (bytes) are not recorded.
max_text_bytes = 1048576

# Delete unpinned items older than this many days. 0 = keep forever.
expire_after_days = 0

# Never record what is copied while one of these apps is focused (X11
# WM_CLASS, case-insensitive). Password managers that mark their clipboard
# content as secret are always skipped, on X11 and Wayland.
ignore_apps = [
  "keepassxc", "org.keepassxc.KeePassXC", "1password", "bitwarden", "Enpass",
  "seahorse", "gnome-keyring", "kwalletmanager5", "kwalletmanager",
]

# ── Hotkey ───────────────────────────────────────────────────────────────────

# Format: modifier+modifier+key (case-insensitive, any order)
# Modifiers: ctrl (or control), alt, super (or win), shift
# Keys:      a-z, 0-9, space, return, escape, tab, backspace, f1-f12
# Examples:  "super+v", "ctrl+alt+c", "super+shift+v"
# On Wayland (GNOME) the hotkey is set up as a GNOME custom shortcut that
# runs `clipboard-manager toggle`.
hotkey = "ctrl+alt+c"

# ── Popup ────────────────────────────────────────────────────────────────────

# "dark" (default), "light", or "system" (follow the GTK theme).
theme = "dark"

popup_width = 440
popup_height = 560
show_timestamps = true

# Open the popup next to the mouse cursor (X11). Otherwise it is centred.
popup_follow_cursor = true

# Seconds during which "Clear history" can be undone. 0 = no undo bar.
clear_undo_timeout_secs = 5

# Show an icon in the system tray (needs the AppIndicator extension on GNOME;
# enabled by default on Ubuntu).
tray_icon = true

# ── Colour overrides (optional) ──────────────────────────────────────────────
# Any value set here wins over the theme. Colours are CSS colours.
#
# [colors]
# background        = "#1b1d22"
# header_background = "#25282f"   # search box, tiles, undo bar
# border            = "rgba(255,255,255,0.08)"
# text              = "#eceef1"
# text_muted        = "#9aa0a8"
# accent            = "#f97316"   # pinned rows, focus, buttons
# error             = "#ef4444"   # delete
# row_hover         = "rgba(255,255,255,0.04)"
# selection         = "rgba(249,115,22,0.12)"

# ── Size overrides in px (optional) ──────────────────────────────────────────
#
# [sizes]
# font_preview = 13
# font_time    = 11
# font_title   = 13
# font_buttons = 13
# font_undo    = 12
# row_height   = 56
